<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<style>
:root{
  --purple:#46178f;--purple-dark:#25076b;--red:#e21b3c;--blue:#1368ce;
  --yellow:#d89e00;--green:#26890c;--ink:#1e293b;--muted:#64748b;--bg:#f2f4f8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--purple-dark);color:#fff;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pinBanner{display:flex;align-items:center;gap:12px}
.pinTag{background:#fff;color:var(--purple-dark);padding:4px 12px;border-radius:999px;font-weight:1000;font-size:18px;letter-spacing:.08em}
button{border:0;border-radius:11px;padding:11px 18px;font-weight:900;font-size:15px;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-1px);filter:brightness(.97)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btnPrimary{background:var(--purple);color:#fff}
.btnGreen{background:var(--green);color:#fff}
.btnBlue{background:var(--blue);color:#fff}
.btnDanger{background:var(--red);color:#fff}
.btnLight{background:#fff;color:var(--ink);border:1px solid #cbd5e1}
.hidden{display:none!important}
main{flex:1;max-width:1280px;width:100%;margin:auto;padding:20px 18px 36px;display:flex;flex-direction:column}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.08)}

/* 等待室 Lobby */
.lobbyGrid{display:grid;gap:24px;align-items:center}
@media(min-width:860px){.lobbyGrid{grid-template-columns:360px 1fr}}
.joinPanel{background:linear-gradient(145deg,#46178f,#25076b);color:#fff;border-radius:20px;padding:24px;text-align:center}
.bigPin{font-size:clamp(42px,6vw,64px);font-weight:1000;letter-spacing:.12em;background:#fff;color:var(--purple-dark);border-radius:16px;padding:10px 16px;margin:12px 0}
#qrBox{background:#fff;padding:14px;border-radius:16px;display:inline-block;margin:8px 0}
.playerCloud{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;min-height:180px;align-content:flex-start}
.playerChip{background:#fff;border:2px solid #cbd5e1;padding:10px 16px;border-radius:999px;font-weight:900;font-size:17px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 10px rgba(0,0,0,.05);animation:popIn .25s ease}
.playerChip.left{opacity:.45;border-style:dashed}
.kickBtn{background:#fee2e2;color:var(--red);padding:2px 7px;border-radius:999px;font-size:12px;margin-left:4px}
@keyframes popIn{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}

/* 出題與揭曉畫面 */
.stageTop{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.qBadge{background:var(--purple);color:#fff;padding:8px 16px;border-radius:999px;font-weight:900;font-size:16px}
.questionBox{background:#fff;border-radius:20px;padding:24px;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.07);margin-bottom:18px}
.questionText{font-size:clamp(24px,3.6vw,38px);font-weight:1000;line-height:1.4;margin:0}
.questionImg{max-height:240px;max-width:100%;border-radius:14px;margin-top:14px;object-fit:contain;border:1px solid #e2e8f0}
.stageVideo{display:block;width:min(100%,520px);height:min(27vh,290px);margin:8px auto;border:0}.hostOptionImage{width:clamp(44px,10vw,140px);height:clamp(42px,11vh,110px);object-fit:contain;background:white;border-radius:8px;flex-shrink:0}
.midHUD{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:16px}
.timerCircle{width:86px;height:86px;border-radius:50%;background:var(--purple);color:#fff;font-size:34px;font-weight:1000;display:grid;place-items:center;box-shadow:0 8px 20px rgba(70,23,143,.28);flex:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ansCounter{background:#fff;padding:12px 22px;border-radius:16px;text-align:center;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.ansCounter b{display:block;font-size:32px;color:var(--purple)}

.progressTable{width:100%;border-collapse:collapse;table-layout:fixed;text-align:left}
.progressTable th,.progressTable td{padding:10px 4px;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}
.progressTable th:last-child,.progressTable td:last-child{text-align:right}
.progressTable td:last-child{font-weight:900;color:var(--purple);font-variant-numeric:tabular-nums}

/* 四色選項卡 */
.optionsGrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.optionsGrid{grid-template-columns:1fr 1fr}}
.optCard{border-radius:16px;padding:20px 22px;color:#fff;font-size:clamp(20px,2.5vw,28px);font-weight:900;display:flex;align-items:center;gap:14px;min-height:92px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:.25s}
.opt0{background:var(--red)}.opt1{background:var(--blue)}.opt2{background:var(--yellow)}.opt3{background:var(--green)}
.optCard.dimmed{opacity:.32;transform:scale(.98)}
.optCard.correctGlow{box-shadow:0 0 0 6px #bbf7d0,0 10px 25px rgba(22,163,74,.4);transform:scale(1.02)}
.optMark{margin-left:auto;font-size:30px}

.optionsGrid.showCounts .optCard{position:relative;padding-bottom:36px}
.optCount{position:absolute;right:12px;bottom:8px;border-radius:999px;padding:3px 9px;background:#fff;color:#1e293b;font-size:16px;line-height:1.2}
.optionsGrid.showCounts .optCard.dimmed{opacity:1}
.optionsGrid.showCounts .optCard.dimmed::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--bg);opacity:.68;pointer-events:none}
.optionsGrid.showCounts .optCard.dimmed .optCount{z-index:1}

/* 排行榜與頒獎台 */
.rankList{display:grid;gap:10px;max-width:780px;margin:16px auto}
.rankRow{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-radius:14px;background:#fff;font-size:20px;font-weight:900;box-shadow:0 4px 12px rgba(15,23,42,.06)}
.rank1{background:linear-gradient(90deg,#fef08a,#fde047);border:2px solid #eab308;font-size:24px}
.rank2{background:linear-gradient(90deg,#f1f5f9,#e2e8f0);border:2px solid #94a3b8;font-size:22px}
.rank3{background:linear-gradient(90deg,#ffedd5,#fed7aa);border:2px solid #f97316;font-size:21px}
</style>
</head>

<main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB42jwW5T_szUqIlvjw2_mGK2QKtDjyISk",
  authDomain: "project-8175340549098107213.firebaseapp.com",
  projectId: "project-8175340549098107213",
  storageBucket: "project-8175340549098107213.firebasestorage.app",
  messagingSenderId: "750702770422",
  appId: "1:750702770422:web:99d24412a55a69033ed4d7",
  measurementId: "G-NX1J2B4V1S"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// 使用長輪詢，避免會緩衝串流回應的網路設備讓 Firestore 誤判離線。
db.settings({ merge: true, experimentalAutoDetectLongPolling: false, experimentalForceLongPolling: true });
const stamp = firebase.firestore.FieldValue.serverTimestamp;
const $ = id => document.getElementById(id);

let teacher;
let roomRef;
let room;
let correctIndexes;
let players = [];
let answers = [];
let remoteAnswers = [];
let watchedIndex = -1;
let stopRoom;
let stopPlayers;
let stopAnswers;
let countdown;
let spokenQuestionKey = "";
let narration = null;
let phaseWrite = false;
const PREPARE_MS = 3000;
const STANDARD_SCORING_MS = 20000;
const REMOTE_FEEDBACK_MS = 900;
// narrationDoneIndex 為 -1 時念題，-2 時準備，題號相符時開放作答。
let busy = false;
let setupLoading = false;
let playersReady = false;
let answersReady = false;
let lastReveal = -1;
let soundEnabled = true;
let audio;

function showView(id) {
  if (id !== "questionView") {
    $("stageVideo").removeAttribute("src");
    $("stageVideo").classList.add("hidden");
    stopClassroomSpeech();
  }
  for (const view of ["setupView", "lobbyView", "questionView", "leaderboardView"]) {
    $(view).classList.toggle("hidden", view !== id);
  }
}

function notice(message = "") {
  $("gameStatus").textContent = message;
  $("gameStatus").classList.toggle("hidden", !message);
}

function firestoreMessage(error) {
  if (error.code === "unavailable" || error.code === "deadline-exceeded" || /client is offline/i.test(error.message || "")) {
    return "暫時無法連到 Firestore。請確認網路後重試。";
  }
  if (error.code === "permission-denied") {
    return "Firestore 拒絕存取。請確認教師帳號和本平台的 Firestore 規則。";
  }
  return error.message || String(error);
}

function unlockAudio() {
  if (!soundEnabled) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  try {
    audio ||= new AudioContext();
    audio.resume().catch(() => {});
  } catch {}
}

function tone(frequency, duration) {
  if (!soundEnabled || audio?.state !== "running") return;
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  const now = audio.currentTime;
  oscillator.frequency.value = frequency;
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  oscillator.connect(gain).connect(audio.destination);
  oscillator.start(now);
  oscillator.stop(now + duration);
}

async function updateClassroomPhase(index, expected, next, ref = roomRef) {
  if (!ref || ref !== roomRef || phaseWrite || room?.status !== "question" ||
      room.currentIndex !== index || (room.playMode || "classroom") !== "classroom") return;
  phaseWrite = true;
  try {
    await db.runTransaction(async transaction => {
      const current = (await transaction.get(ref)).data();
      if (current?.status !== "question" || current.currentIndex !== index ||
          (current.narrationDoneIndex ?? -1) !== expected) return;
      transaction.update(ref, { narrationDoneIndex: next, questionStartedAt: stamp() });
    });
  } catch (error) {
    notice("無法同步作答時間。請檢查連線後重新整理主持頁。 " + firestoreMessage(error));
    if (next === -2 && roomRef === ref) spokenQuestionKey = "";
  } finally {
    phaseWrite = false;
  }
}

function stopClassroomSpeech() {
  if (!narration) return;
  clearTimeout(narration.startTimer);
  narration = null;
  try { window.speechSynthesis?.cancel(); } catch {}
}

function splitNarration(text) {
  const chunks = [];
  let chunk = "";
  let length = 0;
  for (const char of text) {
    chunk += char;
    length++;
    if (length >= 42 || /[。！？；!?\n]/.test(char)) {
      if (chunk.trim()) chunks.push(chunk);
      chunk = "";
      length = 0;
    }
  }
  if (chunk.trim()) chunks.push(chunk);
  return chunks;
}

function speakClassroomQuestion(index, text) {
  const ref = roomRef;
  const key = (ref?.id || "") + ":" + index;
  if (spokenQuestionKey === key) return;
  spokenQuestionKey = key;
  stopClassroomSpeech();

  const chunks = splitNarration(String(text || "").trim());
  const synth = window.speechSynthesis;
  if (!soundEnabled || !chunks.length || !synth || typeof SpeechSynthesisUtterance === "undefined") {
    updateClassroomPhase(index, -1, -2, ref);
    return;
  }

  const session = { utterance: null, startTimer: null };
  narration = session;
  const isCurrent = () => narration === session && roomRef === ref &&
    room?.status === "question" && room.currentIndex === index && (room.narrationDoneIndex ?? -1) === -1;
  const fail = () => {
    if (!isCurrent()) return;
    stopClassroomSpeech();
    notice("瀏覽器未能完成念題，請主持人補充題目內容。");
    updateClassroomPhase(index, -1, -2, ref);
  };

  function speakNext(part) {
    if (!isCurrent()) return;
    if (part === chunks.length) {
      narration = null;
      updateClassroomPhase(index, -1, -2, ref);
      return;
    }
    try {
      const utter = new SpeechSynthesisUtterance(chunks[part]);
      utter.lang = "zh-TW";
      session.utterance = utter;
      const isCurrentPart = () => isCurrent() && session.utterance === utter;
      const clearStartTimer = () => {
        if (isCurrentPart()) clearTimeout(session.startTimer);
      };
      utter.onstart = clearStartTimer;
      utter.onboundary = clearStartTimer;
      utter.onend = () => {
        if (!isCurrentPart()) return;
        clearStartTimer();
        speakNext(part + 1);
      };
      utter.onerror = () => { if (isCurrentPart()) fail(); };
      // 只限制等待語音啟動的時間。開始念題後，等該段實際念完再進入下一段。
      session.startTimer = setTimeout(() => { if (isCurrentPart()) fail(); }, 8000);
      synth.speak(utter);
    } catch {
      fail();
    }
  }

  speakNext(0);
}

const canFinishAll = status => ["question", "grading", "reveal", "leaderboard"].includes(status);

function setControls() {
  const canFinish = canFinishAll(room?.status);
  $("endAllBtn").classList.toggle("hidden", !canFinish);
  $("endAllBtn").disabled = busy || !canFinish;
  $("startGameBtn").disabled = busy || !playersReady || !players.length;
  for (const id of ["revealNowBtn", "stageNextQuestionBtn", "nextStepBtn", "nextQuestionBtn", "exportCsvBtn", "endRoomBtn", "finishCleanupBtn"]) {
    $(id).disabled = busy;
  }
  const classroom = room && (room.playMode || "classroom") === "classroom";
  if (classroom) {
    $("revealNowBtn").disabled = busy || room.status === "reveal";
    $("stageNextQuestionBtn").disabled = busy || room.currentIndex + 1 >= room.questions.length;
  }
}

async function run(action, retryReveal = true) {
  if (busy) return;
  busy = true;
  setControls();
  notice();
  let succeeded = false;
  try {
    await action();
    succeeded = true;
  } catch (error) {
    notice(firestoreMessage(error));
  } finally {
    busy = false;
    setControls();
    if (succeeded && retryReveal && room?.status === "question") maybeReveal();
  }
  return succeeded;
}

async function createRoom(quizId) {
  return run(async () => {
    const quizSnapshot = await db.collection("quizzes").doc(quizId).get({ source: "server" });
    const quiz = quizSnapshot.data();
    if (!quiz || quiz.teacherId !== teacher.uid) throw new Error("找不到可主持的題庫。");
    if (!Array.isArray(quiz.questions) || !quiz.questions.length) throw new Error("題庫至少需要一題。");
    if (quiz.questions.some(q => q.imageBase64)) throw new Error("請先回題庫管理頁連結 Google Drive 並重新儲存舊題庫，移轉圖片後再開始主持。");

    const keys = quiz.questions.map(q => Number(q.correctIndex));
    if (keys.some(key => !Number.isInteger(key) || key < 0 || key > 3) ||
        quiz.questions.some(q => !Array.isArray(q.options) || q.options.length !== 4 || !String(q.text || "").trim())) {
      throw new Error("題庫含有不完整的題目或正解，請回題庫管理頁修正。");
    }
    const questions = quiz.questions.map(q => ({
      text: q.text,
      imageBase64: "",
      imageDriveId: /^[A-Za-z0-9_-]{10,150}$/.test(q.imageDriveId || "") ? q.imageDriveId : "",
      videoDriveId: mediaId(q.videoDriveId),
      optionImageDriveIds: Array.from({length:4},(_,i)=>mediaId(q.optionImageDriveIds?.[i])),
      options: q.options,
      timeLimit: STANDARD_SCORING_MS / 1000,
      pointsMode: "standard"
    }));
    const voiceAnswer = quiz.voiceAnswer === true;
    const playMode = quiz.playMode === "remote" ? "remote" : "classroom";
    const data = {
      teacherId: teacher.uid,
      quizId,
      title: quiz.title || "即時搶答",
      playMode,
      ...(playMode === "remote" ? { selfPaced: true } : {}),
      ...(voiceAnswer ? { voiceAnswer: true } : {}),
      narrationDoneIndex: -1,
      questions,
      status: "lobby",
      currentIndex: 0,
      revealedAnswer: -1
    };
    if (new TextEncoder().encode(JSON.stringify(data)).length > 950000) {
      throw new Error("題庫太大，請減少圖片或把題庫分成兩份再開房。");
    }

    for (let attempt = 0; attempt < 15; attempt++) {
      const pin = String(100000 + Math.floor(Math.random() * 900000));
      const ref = db.collection("rooms").doc(pin);
      const created = await db.runTransaction(async transaction => {
        if ((await transaction.get(ref)).exists) return false;
        transaction.set(ref, { ...data, createdAt: stamp() });
        transaction.set(ref.collection("private").doc("key"), { correctIndexes: keys });
        return true;
      });
      if (created) {
        const url = new URL(location.href);
        url.searchParams.delete("quiz");
        url.searchParams.set("room", pin);
        history.replaceState(null, "", url);
        attachRoom(ref, keys);
        return;
      }
    }
    throw new Error("暫時無法取得房號，請重試。");
  });
}

function resetListeners() {
  clearInterval(countdown);
  stopClassroomSpeech();
  spokenQuestionKey = "";
  stopRoom?.();
  stopPlayers?.();
  stopAnswers?.();
  stopRoom = stopPlayers = stopAnswers = null;
}

function attachRoom(ref, keys) {
  resetListeners();
  roomRef = ref;
  room = null;
  renderedState = "";
  correctIndexes = keys;
  players = [];
  playersReady = false;
  answersReady = false;
  remoteAnswers = [];
  watchedIndex = -1;
  lastReveal = -1;
  const url = new URL("play.html", location.href);
  url.searchParams.set("pin", ref.id);
  $("headerPin").textContent = "PIN: " + ref.id;
  $("headerPin").classList.remove("hidden");
  $("endRoomBtn").classList.remove("hidden");
  $("lobbyPin").textContent = ref.id;
  $("joinUrlText").textContent = url.href;
  $("qrBox").replaceChildren();
  try {
    new QRCode($("qrBox"), { text: url.href, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M });
  } catch {
    $("qrBox").textContent = "請使用下方學生加入網址。";
  }

  stopPlayers = ref.collection("players").onSnapshot({ includeMetadataChanges: true }, snapshot => {
    playersReady = !snapshot.metadata.fromCache && !snapshot.metadata.hasPendingWrites;
    players = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
    if (room?.status === "lobby") renderLobby();
    if (room?.playMode === "remote" && ["question", "grading", "reveal"].includes(room.status)) renderRemoteProgress();
    if (room?.status === "question") {
      updateAnsweredCount();
      maybeReveal();
    }
  }, error => notice("讀取玩家失敗：" + error.message));

  stopRoom = ref.onSnapshot({ includeMetadataChanges: true }, snapshot => {
    if (snapshot.metadata.fromCache || snapshot.metadata.hasPendingWrites) return;
    if (!snapshot.exists) {
      location.replace("index.html");
      return;
    }
    room = snapshot.data();
    renderRoom();
  }, error => notice("讀取房間失敗：" + error.message));
}

function renderLobby() {
  const modeLabel = (room.playMode === "remote" ? "遠端使用" : "教室內使用") +
    (room.voiceAnswer === true ? "・語音辨識" : "");
  $("lobbyQuizTitle").textContent = room.title + "（共 " + room.questions.length + " 題・" + modeLabel + "）";
  $("lobbyPlayerCount").textContent = "目前等待人數：" + players.length + " 人";
  const order = [...players].sort((a, b) => (a.seatNumber || 99) - (b.seatNumber || 99));
  $("playerCloud").replaceChildren(...order.map(player => {
    const row = document.createElement("div");
    row.className = "playerChip";
    const label = document.createElement("span");
    label.textContent = playerLabel(player);
    const kick = document.createElement("button");
    kick.type = "button";
    kick.className = "kickBtn";
    kick.textContent = "✕";
    kick.setAttribute("aria-label", "移除 " + player.displayName);
    kick.onclick = () => run(async () => {
      await db.runTransaction(async transaction => {
        const playerRef = roomRef.collection("players").doc(player.id);
        const [latest, member] = await Promise.all([transaction.get(roomRef), transaction.get(playerRef)]);
        if (latest.data()?.status !== "lobby" || !member.exists) return;
        if (member.data().seatNumber) transaction.delete(roomRef.collection("seats").doc(String(member.data().seatNumber)));
        transaction.delete(playerRef);
      });
    });
    row.append(label, kick);
    return row;
  }));
  setControls();
}

function playerLabel(player) {
  return (player.seatNumber ? "#" + player.seatNumber + " " : "") + (player.displayName || "玩家");
}

function watchQuestion(index) {
  if (watchedIndex === index) return;
  stopAnswers?.();
  watchedIndex = index;
  answers = [];
  answersReady = false;
  stopAnswers = roomRef.collection("answers").where("qIndex", "==", index)
    .onSnapshot({ includeMetadataChanges: true }, snapshot => {
      if (watchedIndex !== index) return;
      answersReady = !snapshot.metadata.fromCache && !snapshot.metadata.hasPendingWrites;
      answers = snapshot.docs.map(doc => doc.data());
      if (room.status === "question") {
        updateAnsweredCount();
        maybeReveal();
      }
      if (room.status === "reveal") renderOptionCounts();
    }, error => notice("讀取作答失敗：" + error.message));
}

function watchRemoteProgress() {
  if (!stopAnswers) {
    const ref = roomRef;
    stopAnswers = ref.collection("answers").onSnapshot({ includeMetadataChanges: true }, snapshot => {
      if (roomRef !== ref || room?.playMode !== "remote") return;
      answersReady = !snapshot.metadata.fromCache && !snapshot.metadata.hasPendingWrites;
      remoteAnswers = snapshot.docs.map(doc => doc.data());
      refreshRemoteProgress();
      maybeReveal();
    }, error => notice("讀取作答失敗：" + error.message));
  }
  refreshRemoteProgress();
}

function refreshRemoteProgress() {
  answers = remoteAnswers.filter(answer => answer.qIndex === room.currentIndex);
  updateAnsweredCount();
  renderRemoteProgress();
}

function renderRemoteProgress() {
  const rows = $("remoteProgressRows");
  if (!playersReady || !answersReady || !players.length) {
    const row = document.createElement("tr");
    const cell = document.createElement("td");
    cell.colSpan = 2;
    cell.textContent = !playersReady || !answersReady ? "正在同步作答進度…" : "目前尚無參加人員";
    row.append(cell);
    rows.replaceChildren(row);
    return;
  }

  const total = room.questions.length;
  const completedByPlayer = remoteAnswersByPlayer(remoteAnswers, total);
  const order = [...players].sort((a, b) => (a.seatNumber || 99) - (b.seatNumber || 99));
  rows.replaceChildren(...order.map(player => {
    const row = document.createElement("tr");
    const name = document.createElement("td");
    const count = document.createElement("td");
    name.textContent = playerLabel(player);
    count.textContent = (completedByPlayer.get(player.id)?.size || 0) + " / " + total;
    row.append(name, count);
    return row;
  }));
}

function updateAnsweredCount() {
  const answered = new Set(answers.map(answer => answer.uid));
  $("answeredCount").textContent = players.filter(player => answered.has(player.id)).length + " / " + players.length;
}

function maybeReveal() {
  if (room?.selfPaced) {
    maybeGradeRemote();
    return;
  }
  if (busy || room?.status !== "question" ||
      (room.playMode !== "remote" && room.narrationDoneIndex !== room.currentIndex) || !answersReady || !playersReady || !players.length) return;
  const answered = new Set(answers.map(answer => answer.uid));
  if (players.every(player => answered.has(player.id))) closeQuestion();
}

function startQuestion(index) {
  return run(async () => {
    await db.runTransaction(async transaction => {
      const current = (await transaction.get(roomRef)).data();
      const expected = index === 0 ? "lobby" : "leaderboard";
      if (current?.status !== expected || (index > 0 && index !== current.currentIndex + 1)) return;
      const question = current.questions[index];
      if (!question) throw new Error("找不到下一題。");
      transaction.update(roomRef, openQuestionFields(index));
    });
  });
}

function openQuestionFields(index) {
  return {
    status: "question",
    currentIndex: index,
    narrationDoneIndex: -1,
    revealedAnswer: -1,
    timeLimit: STANDARD_SCORING_MS / 1000,
    questionStartedAt: stamp()
  };
}

function mediaId(value) { return typeof value === "string" && /^[A-Za-z0-9_-]{10,150}$/.test(value) ? value : ""; }
function renderQuestion() {
  const question = room.questions[room.currentIndex];
  const isClassroom = (room.playMode || "classroom") === "classroom";
  const isReveal = room.status === "reveal";
  $("qProgressBadge").textContent = room.selfPaced
    ? "共 " + room.questions.length + " 題"
    : "第 " + (room.currentIndex + 1) + " / " + room.questions.length + " 題";
  $("stageQuestionBox").classList.toggle("hidden", !isClassroom);
  $("remoteProgress").classList.toggle("hidden", isClassroom);
  $("liveHud").classList.toggle("hidden", room.selfPaced || room.status !== "question");
  $("revealNowBtn").classList.toggle("hidden", !isClassroom && (isReveal || room.selfPaced));
  $("revealNowBtn").textContent = room.status === "grading" ? "繼續結算本題" : isClassroom ? "提前揭曉答案" : "⏹ 結束本題作答";
  $("stageNextQuestionBtn").classList.toggle("hidden", !isClassroom);
  $("nextStepBtn").classList.toggle("hidden", !isClassroom && !isReveal);
  $("nextStepBtn").textContent = isClassroom ? "查看即時排行榜" : room.currentIndex + 1 === room.questions.length ? "🏆 查看最終頒獎台" : "📊 查看即時排行榜";
  if (!isClassroom) {
    $("optionsGrid").classList.add("hidden");
    $("stageVideo").removeAttribute("src");
    watchRemoteProgress();
    return;
  }

  $("stageQuestionText").textContent = question.text;
  const image = $("stageQuestionImg");
  const driveId = /^[A-Za-z0-9_-]{10,150}$/.test(question.imageDriveId || "") ? question.imageDriveId : "";
  const src = driveId ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(driveId)}&sz=w1000` : question.imageBase64;
  const link = $("stageDriveLink");
  link.classList.toggle("hidden", !driveId);
  if (driveId) link.href = `https://drive.google.com/file/d/${encodeURIComponent(driveId)}/view`; else link.removeAttribute("href");
  image.classList.toggle("hidden", !src);
  if (src) { if (image.getAttribute("src") !== src) image.src = src; }
  else image.removeAttribute("src");
  const vid = mediaId(question.videoDriveId), frame = $("stageVideo"), videoLink = $("stageVideoLink");
  const videoSrc = vid ? `https://drive.google.com/file/d/${vid}/preview` : "";
  frame.classList.toggle("hidden", !vid); videoLink.classList.toggle("hidden", !vid);
  if (vid) { if (frame.getAttribute("src") !== videoSrc) frame.src = videoSrc; videoLink.href = `https://drive.google.com/file/d/${vid}/view`; } else { frame.removeAttribute("src"); videoLink.removeAttribute("href"); }

  // 教室內使用：直接顯示題目及四個選項，揭曉時才標示正解。
  $("optionsGrid").classList.remove("hidden");
  $("livePromptText").textContent = "請學生在手機上點擊對應的選項！";

  question.options.forEach((option, index) => {
    $("optText_" + index).textContent = option;
    const card = $("optCard_" + index), id = mediaId(question.optionImageDriveIds?.[index]);
    let picture = card.querySelector(".hostOptionImage");
    if (!picture) { picture = document.createElement("img"); picture.className = "hostOptionImage hidden"; picture.alt = `選項 ${index+1} 圖片`; card.insertBefore(picture, $("optText_" + index)); }
    picture.classList.toggle("hidden", !id);
    if (id) { const url = `https://drive.google.com/thumbnail?id=${id}&sz=w540`; if (picture.getAttribute("src") !== url) picture.src = url; } else picture.removeAttribute("src");
    const correct = isReveal && index === room.revealedAnswer;
    $("optCard_" + index).classList.toggle("correctGlow", correct);
    $("optCard_" + index).classList.toggle("dimmed", isReveal && !correct);
    $("optMark_" + index).textContent = correct ? "✓" : "";
  });
  $("optionsGrid").classList.toggle("showCounts", isReveal);
  for (let index = 0; index < 4; index++) {
    $("optCount_" + index).classList.toggle("hidden", !isReveal);
  }
  watchQuestion(room.currentIndex);
  updateAnsweredCount();
  if (isClassroom && room.status === "question" && (room.narrationDoneIndex ?? -1) === -1) {
    speakClassroomQuestion(room.currentIndex, question.text);
  }
  if (isReveal) {
    renderOptionCounts();
    if (lastReveal !== room.currentIndex) {
      lastReveal = room.currentIndex;
      tone(523.25, 0.15);
      setTimeout(() => tone(659.25, 0.15), 140);
      setTimeout(() => tone(783.99, 0.32), 280);
    }
  }
}

function renderOptionCounts() {
  const counts = [0, 0, 0, 0];
  for (const { choiceIndex } of answers) {
    if (Number.isInteger(choiceIndex) && choiceIndex >= 0 && choiceIndex < counts.length) counts[choiceIndex]++;
  }
  counts.forEach((count, index) => {
    $("optCount_" + index).textContent = count + " 人";
  });
}

function showOpenQuestion() {
  $("timerCircle").textContent = "∞";
  $("livePromptText").textContent = "不限時作答，請在手機上點擊對應選項。";
}

function startPrepareCountdown() {
  if (room.playMode === "remote" || room.narrationDoneIndex === room.currentIndex) {
    showOpenQuestion();
    return;
  }
  const index = room.currentIndex;
  let attemptedOpenAt = 0;
  const tick = () => {
    if (room?.status !== "question" || room.currentIndex !== index) return;
    if (room.narrationDoneIndex === index) {
      clearInterval(countdown);
      showOpenQuestion();
      return;
    }
    const startedAt = room.questionStartedAt?.toMillis();
    const timer = $("timerCircle");
    const prompt = $("livePromptText");
    if (room.narrationDoneIndex !== -2 || !Number.isFinite(startedAt)) {
      timer.textContent = "—";
      prompt.textContent = "正在念題目，請學生等候。";
      return;
    }
    const remaining = Math.max(0, Math.min(3, Math.ceil((startedAt + PREPARE_MS - Date.now()) / 1000)));
    timer.textContent = remaining || "—";
    prompt.textContent = "請準備作答";
    if (!remaining && !busy && Date.now() >= attemptedOpenAt) {
      attemptedOpenAt = Date.now() + 3000;
      updateClassroomPhase(index, -2, index);
    }
  };
  countdown = setInterval(tick, 200);
  tick();
}

function standardPoints(answer, correct, startedAt) {
  if (answer?.choiceIndex !== correct) return 0;
  const submittedAt = answer.submittedAt?.toMillis?.();
  const elapsed = Number.isFinite(submittedAt) && Number.isFinite(startedAt)
    ? Math.min(STANDARD_SCORING_MS, Math.max(0, submittedAt - startedAt))
    : STANDARD_SCORING_MS;
  return Math.round(1000 - 500 * (elapsed / STANDARD_SCORING_MS));
}

function remoteAnswersByPlayer(entries, total) {
  const playersById = new Map();
  for (const answer of entries) {
    if (!Number.isInteger(answer.qIndex) || answer.qIndex < 0 || answer.qIndex >= total) continue;
    if (!playersById.has(answer.uid)) playersById.set(answer.uid, new Map());
    playersById.get(answer.uid).set(answer.qIndex, answer);
  }
  return playersById;
}

function maybeGradeRemote() {
  if (busy || room.status !== "question" || !answersReady || !playersReady || !players.length) return;
  const index = remoteAnswersByPlayer(remoteAnswers, room.questions.length);
  const pending = players.filter(player => index.get(player.id)?.has((player.lastScoredIndex ?? -1) + 1));
  if (!pending.length && !players.every(player => player.lastScoredIndex === room.questions.length - 1)) return;
  const seenPlayers = players;
  const seenAnswers = remoteAnswers;
  return run(async () => {
    const ref = roomRef;
    if (pending.length) await gradeRemoteAnswers(ref, room, index, pending, "question");
    else await finalizeRemoteRoom(ref, "question");
  }, false).then(succeeded => {
    if (succeeded && room?.selfPaced && (players !== seenPlayers || remoteAnswers !== seenAnswers)) maybeGradeRemote();
  });
}

async function gradeRemoteAnswers(ref, liveRoom, answerIndex, members, expectedStatus) {
  for (let start = 0; start < members.length; start += 10) {
    const group = members.slice(start, start + 10);
    await db.runTransaction(async transaction => {
      const snapshot = await transaction.get(ref);
      if (snapshot.data()?.status !== expectedStatus) return;
      const fresh = await Promise.all(group.map(({ id }) => transaction.get(ref.collection("players").doc(id))));
      for (const member of fresh) {
        if (!member.exists) continue;
        const player = member.data();
        const answers = answerIndex.get(member.id);
        let index = (player.lastScoredIndex ?? -1) + 1;
        if (!answers?.has(index)) continue;
        let totalScore = Number(player.totalScore || 0);
        let correctCount = Number(player.correctCount || 0);
        let streak = Number(player.streak || 0);
        let lastPoints = 0;
        while (answers.has(index)) {
          const answer = answers.get(index);
          const previousTime = answers.get(index - 1)?.submittedAt?.toMillis?.();
          const startedAt = index === 0 ? liveRoom.questionStartedAt?.toMillis?.() :
            Number.isFinite(previousTime) ? previousTime + REMOTE_FEEDBACK_MS : undefined;
          const correct = correctIndexes[index];
          const passed = answer.choiceIndex === correct;
          lastPoints = standardPoints(answer, correct, startedAt);
          totalScore += lastPoints;
          correctCount += Number(passed);
          streak = passed ? streak + 1 : 0;
          index++;
        }
        transaction.update(member.ref, {
          totalScore, correctCount, streak, lastPoints, lastScoredIndex: index - 1
        });
      }
    });
  }
}

function finishRemoteRoom() {
  return run(async () => {
    const ref = roomRef;
    const frozen = await db.runTransaction(async transaction => {
      const current = (await transaction.get(ref)).data();
      if (!current?.selfPaced || !["question", "grading"].includes(current.status)) return null;
      if (current.status === "question") transaction.update(ref, { status: "grading" });
      return current;
    });
    if (!frozen) return;
    const [answerSnapshot, memberSnapshot] = await Promise.all([
      ref.collection("answers").get({ source: "server" }),
      ref.collection("players").get({ source: "server" })
    ]);
    const index = remoteAnswersByPlayer(answerSnapshot.docs.map(doc => doc.data()), frozen.questions.length);
    await gradeRemoteAnswers(ref, frozen, index, memberSnapshot.docs, "grading");
    await finalizeRemoteRoom(ref, "grading");
  });
}

async function finalizeRemoteRoom(ref, expectedStatus) {
  await saveFinalRanks();
  await db.runTransaction(async transaction => {
    const current = (await transaction.get(ref)).data();
    if (current?.selfPaced && current.status === expectedStatus) {
      transaction.update(ref, { status: "finished" });
    }
  });
}

function closeQuestion(finishAll = false, destination = "reveal") {
  if (room?.selfPaced) return finishRemoteRoom();
  return run(async () => {
    const index = room.currentIndex;
    const frozen = await db.runTransaction(async transaction => {
      const current = (await transaction.get(roomRef)).data();
      const canGrade = finishAll ? canFinishAll(current?.status) : ["question", "grading"].includes(current?.status) || (destination !== "reveal" && current?.status === "reveal");
      if (!canGrade || current.currentIndex !== index) return null;
      if (current.status !== "grading") transaction.update(roomRef, { status: "grading" });
      return current;
    });
    if (!frozen) return;

    const [answerSnapshot, playerSnapshot] = await Promise.all([
      roomRef.collection("answers").where("qIndex", "==", index).get({ source: "server" }),
      roomRef.collection("players").get({ source: "server" })
    ]);
    const answerByUid = new Map(answerSnapshot.docs.map(doc => [doc.data().uid, doc.data()]));
    const correct = correctIndexes[index];
    const startedAt = frozen.questionStartedAt?.toMillis?.();

    for (let start = 0; start < playerSnapshot.docs.length; start += 10) {
      const group = playerSnapshot.docs.slice(start, start + 10);
      await db.runTransaction(async transaction => {
        const current = (await transaction.get(roomRef)).data();
        if (current?.status !== "grading" || current.currentIndex !== index) return;
        const members = await Promise.all(group.map(doc => transaction.get(doc.ref)));
        for (const member of members) {
          if (!member.exists) continue;
          const player = member.data();
          if (player.lastScoredIndex >= index) continue;
          const answer = answerByUid.get(member.id);
          const passed = answer?.choiceIndex === correct;
          const points = standardPoints(answer, correct, startedAt);
          transaction.update(member.ref, {
            totalScore: Number(player.totalScore || 0) + points,
            streak: passed ? Number(player.streak || 0) + 1 : 0,
            correctCount: Number(player.correctCount || 0) + Number(passed),
            lastPoints: points,
            lastScoredIndex: index
          });
        }
      });
    }

    const remote = frozen.playMode === "remote";
    const last = index + 1 === frozen.questions.length;
    const finished = finishAll || (remote && last) || (!remote && last && destination !== "reveal");
    if (finished) await saveFinalRanks();
    await db.runTransaction(async transaction => {
      const current = (await transaction.get(roomRef)).data();
      if (current?.status !== "grading" || current.currentIndex !== index) return;
      if ((remote || destination === "next") && !finished) {
        transaction.update(roomRef, openQuestionFields(index + 1));
      } else {
        const status = finished ? "finished" : destination === "leaderboard" ? "leaderboard" : "reveal";
        transaction.update(roomRef, { status, revealedAnswer: correct });
      }
    });
  });
}

function rankPlayers(members) {
  const ordered = [...members].sort((a, b) => b.totalScore - a.totalScore ||
    (a.seatNumber || 99) - (b.seatNumber || 99) || a.id.localeCompare(b.id));
  let rank = 0;
  return ordered.map((player, index) => {
    if (index === 0 || player.totalScore !== ordered[index - 1].totalScore) rank = index + 1;
    return { ...player, rank };
  });
}

async function readRanks() {
  const snapshot = await roomRef.collection("players").get({ source: "server" });
  return rankPlayers(snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id })));
}

async function saveFinalRanks() {
  const ranked = await readRanks();
  for (let offset = 0; offset < ranked.length; offset += 15) {
    const batch = db.batch();
    for (const player of ranked.slice(offset, offset + 15)) {
      batch.update(roomRef.collection("players").doc(player.id), { finalRank: player.rank });
    }
    await batch.commit();
  }
}

function advanceFromReveal() {
  return run(async () => {
    const index = room.currentIndex;
    const last = index + 1 === room.questions.length;
    if (last) await saveFinalRanks();
    await db.runTransaction(async transaction => {
      const current = (await transaction.get(roomRef)).data();
      if (current?.status === "reveal" && current.currentIndex === index) {
        transaction.update(roomRef, { status: last ? "finished" : "leaderboard" });
      }
    });
  });
}

function renderLeaderboard(ranked, final, index) {
  $("boardHeading").textContent = final ? "🏆 最終頒獎台與總成績" : "📊 第 " + (index + 1) + " 題後即時排行榜";
  $("rankList").replaceChildren(...ranked.map(player => {
    const row = document.createElement("div");
    row.className = "rankRow" + (player.rank <= 3 ? " rank" + player.rank : "");
    const name = document.createElement("span");
    const score = document.createElement("span");
    const medal = ["", "🥇", "🥈", "🥉"][player.rank];
    name.textContent = (medal || ("第 " + player.rank + " 名")) + " " + playerLabel(player);
    score.textContent = player.totalScore + " 分";
    row.append(name, score);
    return row;
  }));
  if (!ranked.length) $("rankList").textContent = "尚無玩家分數資料";
}

let renderedState = "";
function renderRoom() {
  if (room.status !== "question" || (room.narrationDoneIndex ?? -1) !== -1) stopClassroomSpeech();
  const state = room.status + ":" + room.currentIndex;
  if (state !== renderedState) {
    renderedState = state;
    clearInterval(countdown);
    if (room.status === "lobby") {
      renderLobby();
      showView("lobbyView");
    } else if (["question", "grading", "reveal"].includes(room.status)) {
      showView("questionView");
      renderQuestion();
      if (room.status === "question") {
        startPrepareCountdown();
        maybeReveal();
      }
    } else if (["leaderboard", "finished"].includes(room.status)) {
      const final = room.status === "finished";
      $("rankList").textContent = "正在讀取排行榜…";
      $("nextQuestionBtn").classList.toggle("hidden", final);
      $("exportCsvBtn").classList.toggle("hidden", !final);
      $("finishCleanupBtn").classList.toggle("hidden", !final);
      showView("leaderboardView");
      readRanks().then(ranks => {
        if (renderedState === state) renderLeaderboard(ranks, final, room.currentIndex);
      }).catch(error => {
        if (renderedState !== state) return;
        $("rankList").textContent = "讀取排行榜失敗，重新載入頁面可重試。";
        notice(error.message);
      });
    } else if (room.status === "closed") {
      $("hostLoginBox").classList.add("hidden");
      $("quizPickerBox").classList.add("hidden");
      $("setupStatus").textContent = "房間已關閉。若尚有資料，可按右上角繼續清除。";
      showView("setupView");
    }
    setControls();
  }
}

function csvCell(value) {
  let text = String(value ?? "");
  if (typeof value === "string" && /^[\s\uFEFF]*[=+@-]/.test(text)) text = "'" + text;
  return '"' + text.replace(/"/g, '""') + '"';
}

async function exportCsv() {
  const ranks = await readRanks();
  const header = ["名次", "座號", "玩家名稱", "總積分", "答對題數", "總題數", "連線狀態"];
  const rows = ranks.map(p => [
    p.rank, p.seatNumber, p.displayName, p.totalScore, p.correctCount || 0,
    room.questions.length, p.onlineStatus === "left" ? "曾離開頁面" : "未回報離開"
  ]);
  const blob = new Blob(["\uFEFF" + [header, ...rows].map(row => row.map(csvCell).join(",")).join("\r\n")],
    { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = room.title.replace(/[\\/:*?"<>|]/g, "_") + "_" + roomRef.id + ".csv";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function clearCollection(name) {
  const collection = roomRef.collection(name);
  while (true) {
    const snapshot = await collection.limit(15).get({ source: "server" });
    if (snapshot.empty) return;
    const batch = db.batch();
    snapshot.docs.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
  }
}

function closeRoom() {
  if (busy || !roomRef || !confirm("確定清除這場遊戲的所有玩家與作答紀錄？請先匯出需要保留的成績。")) return;
  return run(async () => {
    await roomRef.update({ status: "closed" });
    for (const collection of ["answers", "seats", "players"]) await clearCollection(collection);
    const batch = db.batch();
    batch.delete(roomRef.collection("private").doc("key"));
    batch.delete(roomRef);
    await batch.commit();
    resetListeners();
    location.replace("index.html");
  });
}

async function setup(reconnect = false) {
  if (!teacher || setupLoading) return;
  setupLoading = true;
  $("retrySetupBtn").disabled = true;
  $("retrySetupBtn").classList.add("hidden");
  $("backToEditor").classList.add("hidden");
  $("quizPickerBox").classList.add("hidden");
  notice();
  $("setupStatus").textContent = "正在連線並讀取題庫…";
  try {
    if (reconnect) {
      await db.disableNetwork();
      await db.enableNetwork();
    }
    await loadSetup();
  } catch (error) {
    $("setupStatus").textContent = firestoreMessage(error);
    $("retrySetupBtn").classList.remove("hidden");
    $("backToEditor").classList.remove("hidden");
  } finally {
    setupLoading = false;
    $("retrySetupBtn").disabled = false;
  }
}

async function loadSetup() {
  const params = new URLSearchParams(location.search);
  const pin = params.get("room");
  if (pin && /^\d{6}$/.test(pin)) {
    const ref = db.collection("rooms").doc(pin);
    const snapshot = await ref.get({ source: "server" });
    if (!snapshot.exists || snapshot.data().teacherId !== teacher.uid) throw new Error("找不到可恢復的房間，請回題庫重新開房。");
    const keys = snapshot.data().status === "closed" ? [] :
      (await ref.collection("private").doc("key").get({ source: "server" })).data()?.correctIndexes;
    if (!Array.isArray(keys)) throw new Error("此房間缺少正解資料，請回題庫重新開房。");
    $("setupStatus").textContent = "";
    attachRoom(ref, keys);
    return;
  }
  if (params.has("quiz")) {
    if (!await createRoom(params.get("quiz"))) {
      $("setupStatus").textContent = $("gameStatus").textContent || "尚未能建立房間，請重試。";
      notice();
      $("retrySetupBtn").classList.remove("hidden");
      $("backToEditor").classList.remove("hidden");
    } else {
      $("setupStatus").textContent = "";
    }
    return;
  }
  const query = await db.collection("quizzes").where("teacherId", "==", teacher.uid).get({ source: "server" });
  $("setupStatus").textContent = "";
  $("quizPickerBox").classList.remove("hidden");
  $("hostQuizList").replaceChildren(...query.docs.map(doc => {
    const quiz = doc.data();
    const button = document.createElement("button");
    button.type = "button";
    button.className = "btnPrimary";
    const modeText = (quiz.playMode === "remote" ? "遠端使用" : "教室內使用") +
      (quiz.voiceAnswer === true ? "・語音辨識" : "");
    button.textContent = (quiz.title || "未命名題庫") + "（" + (quiz.questions?.length || 0) + " 題・" + modeText + "）▶";
    button.onclick = () => createRoom(doc.id);
    return button;
  }));
  if (query.empty) $("hostQuizList").textContent = "尚無題庫，請回題庫管理頁建立題庫。";
}

$("hostLoginBtn").onclick = async () => {
  try {
    await auth.signInWithEmailAndPassword($("hostEmail").value.trim(), $("hostPass").value);
  } catch (error) {
    $("setupStatus").textContent = "登入失敗：" + error.message;
  }
};
auth.onAuthStateChanged(user => {
  teacher = user && !user.isAnonymous ? user : null;
  $("hostLoginBox").classList.toggle("hidden", Boolean(teacher));
  if (teacher) setup();
  else {
    resetListeners();
    roomRef = room = null;
    $("headerPin").classList.add("hidden");
    $("endRoomBtn").classList.add("hidden");
    $("endAllBtn").classList.add("hidden");
    $("retrySetupBtn").classList.add("hidden");
    $("backToEditor").classList.add("hidden");
    $("quizPickerBox").classList.add("hidden");
    $("setupStatus").textContent = "請先登入教師帳號。";
    showView("setupView");
  }
});

$("retrySetupBtn").onclick = () => setup(true);
document.addEventListener("click", unlockAudio);
$("soundToggleBtn").onclick = () => {
  soundEnabled = !soundEnabled;
  $("soundToggleBtn").textContent = soundEnabled ? "🔊 音效：開" : "🔇 音效：關";
  if (!soundEnabled) {
    stopClassroomSpeech();
    if (room?.status === "question") updateClassroomPhase(room.currentIndex, -1, -2);
  }
};
$("copyJoinUrlBtn").onclick = async () => {
  try {
    await navigator.clipboard.writeText($("joinUrlText").textContent);
    $("copyJoinUrlBtn").textContent = "✅ 已複製加入網址";
  } catch {
    notice("目前無法自動複製，請選取下方網址手動複製。");
  }
};
$("startGameBtn").onclick = () => startQuestion(0);
$("revealNowBtn").onclick = () => closeQuestion();
$("endAllBtn").onclick = () => closeQuestion(true);
$("stageNextQuestionBtn").onclick = () => closeQuestion(false, "next");
$("nextStepBtn").onclick = () => {
  if ((room?.playMode || "classroom") === "classroom") closeQuestion(false, "leaderboard");
  else advanceFromReveal();
};
$("nextQuestionBtn").onclick = () => startQuestion(room.currentIndex + 1);
$("exportCsvBtn").onclick = () => run(exportCsv);
$("endRoomBtn").onclick = closeRoom;
$("finishCleanupBtn").onclick = closeRoom;
</script>
</body>
